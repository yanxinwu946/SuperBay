[package]
name = "superbay"
version = "0.1.0"
edition = "2024"
license = "MIT"
default-run = "superbay"

[[bin]]
name = "superbay"
path = "native/main.rs"

[dependencies]
anyhow = "1"
async-channel = "2"
base64 = "0.22"
chrono = "0.4"
gpui = { version = "=0.2.2", default-features = false }
gpui-component = { version = "=0.5.1", default-features = false }
gpui-component-assets = "=0.5.1"
notify = "7"
pinyin = { version = "0.10", default-features = false, features = ["plain"] }
regex = "1"
raw-window-handle = "0.6"
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tempfile = "3"
unicode-normalization = "0.1"
windows = { version = "0.61", features = ["Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-registry = "0.5"

[profile.dev]
debug = 0

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = "thin"
strip = "symbols"
